<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>WebTest Helper</title>
</head>
<body>
  <header>
    <h1>WebTest Helper</h1>
    <span class="ver">v1.2</span>
  </header>

  <div class="row">
    <button id="btnPick" class="primary">① 点选元素取定位</button>
    <button id="btnStop">停止</button>
  </div>
  <div class="row">
    <button id="btnFields">② 导出页面字段</button>
    <button id="btnRequests">③ 刷新接口记录</button>
  </div>

  <textarea id="out" spellcheck="false" placeholder="点上面的按钮，结果会出现在这里"></textarea>

  <div class="row">
    <button id="btnCopy" class="primary">复制结果</button>
    <span id="tip" class="tip"></span>
  </div>

  <ul id="reqList"></ul>

  <script src="popup.js"></script>
</body>
</html>
